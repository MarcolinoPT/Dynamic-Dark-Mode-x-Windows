name: Windows CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test Windows companion
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up .NET 10
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: 10.0.x

      - name: Report toolchain
        run: dotnet --info

      - name: Restore
        run: dotnet restore DynamicDarkMode.Windows.sln

      - name: Build
        run: dotnet build DynamicDarkMode.Windows.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DynamicDarkMode.Windows.sln --configuration Release --no-build --logger "console;verbosity=normal"
