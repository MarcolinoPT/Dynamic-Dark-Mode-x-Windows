name: macOS CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Ruby for CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install CocoaPods
        run: gem install cocoapods --version 1.17.0 --no-document

      - name: Report toolchain
        run: |
          sw_vers
          xcodebuild -version
          ruby --version
          pod --version

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          set -o pipefail
          pod install 2>&1 | tee pod-install.log

      - name: List workspace schemes and targets
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -list -workspace "Dynamic Dark Mode.xcworkspace" 2>&1 | tee xcodebuild-list.log

      - name: Build existing macOS app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace "Dynamic Dark Mode.xcworkspace" \
            -scheme "Dynamic Dark Mode" \
            -configuration Debug \
            -destination 'platform=macOS' \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild-build.log

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-ci-diagnostics
          path: |
            pod-install.log
            xcodebuild-list.log
            xcodebuild-build.log
          if-no-files-found: ignore
          retention-days: 7
